version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: coderank-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: "coderank"

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: coderank-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/coderank?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "password"

      APP_JWT_SECRET: "CodeRankSecretKey2024SuperLongAndSecureSecretKeyForJWTTokenGeneration"
      APP_JWT_EXPIRATION: "86400000"

      APP_EXECUTION_TEMP_DIR: "/tmp/coderank"
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:3000"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs:/app/logs

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: coderank-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

volumes:
  mysql_data: