# ============================================================
# CodeRank - Application Configuration
# ============================================================

server.port=8080
spring.application.name=coderank

# ============================================================
# MySQL Database
# ============================================================
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/coderank?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT
# ============================================================
app.jwt.secret=CodeRankSecretKey2024SuperLongAndSecureSecretKeyForJWTTokenGeneration
app.jwt.expiration=86400000

# ============================================================
# Code Execution
# ============================================================
app.execution.timeout=5
app.execution.temp-dir=/tmp/coderank

# ============================================================
# Logging
# ============================================================
logging.level.com.coderank=INFO
logging.level.org.springframework.security=WARN
logging.file.name=logs/coderank.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
